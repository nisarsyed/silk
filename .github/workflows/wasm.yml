name: WebAssembly

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      redeploy_run_id:
        description: "Optional successful main WebAssembly run ID to redeploy without rebuilding its artifact"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Emscripten 6.0.9 / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned SDK
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout 5eb0bde7585670252e8ba05e9d361627bffd08b5
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.9
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.9
      - name: Configure, build, and run complete C suite
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --preset wasm-${{ matrix.mode }}
          emcc --version > build/wasm-${{ matrix.mode }}/toolchain.txt
          "$EMSDK_NODE" --version >> build/wasm-${{ matrix.mode }}/toolchain.txt
          git -C "$EMSDK" rev-parse HEAD >> build/wasm-${{ matrix.mode }}/toolchain.txt
          git rev-parse HEAD >> build/wasm-${{ matrix.mode }}/toolchain.txt
          cmake --build --preset wasm-${{ matrix.mode }} --parallel 2
          ctest --preset wasm-${{ matrix.mode }}
          "$EMSDK_NODE" wasm/test.mjs build/wasm-${{ matrix.mode }}/package/index.mjs
          python3 wasm/test_provision_memory.py
      - name: Verify installed typed package and browser consumers
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm ci --prefix wasm --ignore-scripts --no-audit --no-fund
          PLAYWRIGHT_SKIP_BROWSER_GC=1 node wasm/node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
          node wasm/test_package.mjs build/wasm-${{ matrix.mode }}/package | tee build/wasm-${{ matrix.mode }}/package-consumers.txt
      - name: Verify benchmark phases and Node/browser smoke replay
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          node bench/wasm/test_driver.mjs build/wasm-${{ matrix.mode }}/benchmark/driver.mjs
          node bench/render/test_study.mjs build/wasm-${{ matrix.mode }}/render-physics
          node browser/test_runtime.mjs
          node browser/test_input_trace.mjs
          node browser/test_frame_trace.mjs
          node browser/test_presentation_clock.mjs
          node browser/test_wasm_runtime.mjs build/wasm-${{ matrix.mode }}/render-physics
          for sleep in off on; do
            for host in node browser; do
              browser_args=()
              if [[ "$host" == browser ]]; then browser_args=(--browser); fi
              output="build/wasm-${{ matrix.mode }}/benchmark-reports/$host-$sleep"
              node bench/wasm/cli.mjs --build build/wasm-${{ matrix.mode }}/benchmark \
                --output "$output" --smoke --repeat 2 --sleep "$sleep" "${browser_args[@]}"
              python3 bench/wasm/validate.py validate "$output/run-1.json"
              python3 bench/wasm/validate.py compare "$output/run-1.json" "$output/run-2.json" > "$output/replay.json"
            done
          done
          python3 bench/wasm/test_report.py --report build/wasm-${{ matrix.mode }}/benchmark-reports/node-off/run-1.json
      - name: Verify matched renderer base visuals
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          mode="${{ matrix.mode }}"
          emcmake cmake -S . -B "build/wasm-render-$mode" \
            -DCMAKE_BUILD_TYPE="${mode^}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSL_BUILD_TESTS=OFF -DSL_INSTALL=OFF -DSL_RENDER_STUDY=ON
          cmake --build "build/wasm-render-$mode" --parallel 2
          python3 bench/render/build.py --benchmark "build/wasm-$mode/benchmark" \
            --raylib "build/wasm-render-$mode/render-study" --output "build/render-study-$mode"
          python3 bench/render/test_metadata.py
          node bench/render/test_provenance.mjs "build/render-study-$mode"
          node bench/render/test_placement_browser.mjs "build/render-study-$mode"
          for engine in chromium firefox webkit; do
            # Firefox and WebKit need an X display for WebGL 2 on GPU-less runners.
            browser_command=(node)
            if [[ "$engine" != chromium ]]; then browser_command=(xvfb-run -a node); fi
            "${browser_command[@]}" bench/render/test_presentation_browser.mjs "build/render-study-$mode" "$engine"
            "${browser_command[@]}" bench/render/test_runtime_browser.mjs "build/render-study-$mode" "$engine"
            "${browser_command[@]}" bench/render/test_runtime_controller_browser.mjs "build/render-study-$mode" "$engine"
            "${browser_command[@]}" bench/render/test_input_trace_browser.mjs "build/render-study-$mode" "$engine"
            "${browser_command[@]}" bench/render/test_pointer_adapter_browser.mjs "build/render-study-$mode" "$engine"
            "${browser_command[@]}" bench/render/test_sandbox_browser.mjs "build/render-study-$mode" "$engine"
          done
          node bench/render/test_geometry.mjs "build/render-study-$mode"
          node bench/render/test_overlay.mjs "build/render-study-$mode"
          node bench/render/test_pointer.mjs "build/render-study-$mode"
          node bench/render/test_frozen.mjs "build/render-study-$mode"
          node bench/render/test_canvas_frozen.mjs "build/render-study-$mode"
          node bench/render/test_recording.mjs "build/render-study-$mode"
          node bench/render/test_timing.mjs "build/render-study-$mode"
          node bench/render/test_gpu.mjs "build/render-study-$mode"
          node bench/render/test_gl_stats.mjs "build/render-study-$mode"
          node bench/render/test_windows.mjs "build/render-study-$mode"
          SL_RENDER_TEST_CLOCK=synthetic node bench/render/test_runner.mjs "build/render-study-$mode" "build/reports/render-$mode/runner"
          mkdir -p "build/reports/render-$mode/runner/audits"
          for report in build/reports/render-"$mode"/runner/*-base.json build/reports/render-"$mode"/runner/*-diagnostic.json; do
            python3 bench/render/validate.py "$report" > "build/reports/render-$mode/runner/audits/$(basename "$report")"
          done
          node bench/render/test_hud.mjs "build/render-study-$mode" "build/reports/render-$mode/hud"
          node bench/render/test_pointer_browser.mjs "build/render-study-$mode" "build/reports/render-$mode/pointer"
          node bench/render/test_input_browser.mjs "build/render-study-$mode" "build/reports/render-$mode/input"
          python3 bench/render/test_validate.py "build/reports/render-$mode/runner" "build/render-study-$mode" "build/reports/render-$mode/input"
          python3 bench/render/test_protocol.py
          node bench/render/test_browser.mjs "build/render-study-$mode" "build/reports/render-$mode"
      - name: Build and verify downloadable browser distribution
        if: matrix.mode == 'release'
        shell: bash
        run: |
          python3 browser/build_distribution.py --assembled build/render-study-release \
            --package build/wasm-release/package --output build/browser-site
          node browser/test_distribution.mjs build/browser-site
      - uses: actions/upload-artifact@v7
        if: matrix.mode == 'release'
        with:
          name: browser-site-${{ github.sha }}
          path: build/browser-site/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wasm-core-${{ matrix.mode }}-${{ github.sha }}
          path: |
            build/reports/render-${{ matrix.mode }}/
            build/wasm-render-${{ matrix.mode }}/compile_commands.json
            build/wasm-render-${{ matrix.mode }}/bench/render/CMakeFiles/silk_render_raylib.dir/link.txt
            build/wasm-${{ matrix.mode }}/toolchain.txt
            build/wasm-${{ matrix.mode }}/package-consumers.txt
            build/wasm-${{ matrix.mode }}/compile_commands.json
            build/wasm-${{ matrix.mode }}/tests/CMakeFiles/sl_tests.dir/link.txt
            build/wasm-${{ matrix.mode }}/wasm/CMakeFiles/silk_wasm.dir/link.txt
            build/wasm-${{ matrix.mode }}/wasm/CMakeFiles/silk_wasm_bench.dir/link.txt
            build/wasm-${{ matrix.mode }}/wasm/CMakeFiles/silk_wasm_study.dir/link.txt
            build/wasm-${{ matrix.mode }}/benchmark/build.json
            build/wasm-${{ matrix.mode }}/render-physics/build.json
            build/wasm-render-${{ matrix.mode }}/render-study/build.json
            build/render-study-${{ matrix.mode }}/provenance.json
            build/wasm-${{ matrix.mode }}/benchmark-reports/
            build/wasm-${{ matrix.mode }}/Testing/Temporary/
          retention-days: 14
          if-no-files-found: warn

  pages:
    name: Deploy verified browser artifact
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Select a verified main artifact
        id: selected
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.redeploy_run_id }}
        run: |
          if [[ -z "$REQUESTED_RUN_ID" ]]; then
            echo "run_id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            [[ "$REQUESTED_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Run ID must be numeric' >&2; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REQUESTED_RUN_ID" > "$RUNNER_TEMP/selected-run.json"
            jq -e '.name == "WebAssembly" and .head_branch == "main" and .conclusion == "success"' \
              "$RUNNER_TEMP/selected-run.json" >/dev/null
            echo "run_id=$REQUESTED_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "sha=$(jq -r .head_sha "$RUNNER_TEMP/selected-run.json")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        with:
          name: browser-site-${{ steps.selected.outputs.sha }}
          path: site
          run-id: ${{ steps.selected.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the selected artifact before publishing
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.selected.outputs.sha }}
        run: python3 browser/verify_distribution.py site "$EXPECTED_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
