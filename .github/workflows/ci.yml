name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to match .clang-format expectations; output differs across
      # major versions, so an unpinned runner would fail valid PRs.
      - run: pipx install clang-format==22.1.3
      - run: clang-format --dry-run --Werror include/silk/*.h src/*.c tests/*.h tests/*.c examples/sandbox/*.c

  linux:
    name: ${{ matrix.cc }} / ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: ctest --preset debug

  macos:
    name: clang / macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: ctest --preset debug

  sanitize:
    name: asan+ubsan / ubuntu
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset sanitize
      - run: cmake --build --preset sanitize
      - run: ctest --preset sanitize

  sandbox:
    name: sandbox / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Raylib's GLFW build needs the X11/GL dev headers even for a
      # compile-only check; audio is disabled, so no ALSA. This job is
      # the only place main.c compiles against the public headers.
      - run: >
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev
          libxi-dev
      - run: cmake --preset sandbox -DCUSTOMIZE_BUILD=ON -DUSE_AUDIO=OFF
      - run: cmake --build --preset sandbox
